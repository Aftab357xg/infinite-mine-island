<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Infinite Mine Island</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  overflow:hidden;background:#071525;color:#fff;
  font-family:Arial,sans-serif;touch-action:manipulation
}
#game{
  width:100%;height:100vh;max-width:560px;margin:auto;
  position:relative;overflow:hidden;
  background:linear-gradient(#58c9ff 0 48%,#176fae 48% 100%);
}

/* SKY */
.sun{
 position:absolute;width:90px;height:90px;border-radius:50%;
 background:#ffe58a;right:35px;top:55px;
 box-shadow:0 0 45px #fff2a6
}
.cloud{
 position:absolute;width:120px;height:32px;background:#fff;
 border-radius:30px;opacity:.8;top:105px;left:-140px;
 animation:cloud 28s linear infinite
}
.cloud:before,.cloud:after{
 content:"";position:absolute;background:#fff;border-radius:50%
}
.cloud:before{width:48px;height:48px;left:20px;top:-20px}
.cloud:after{width:60px;height:60px;right:18px;top:-28px}
.c2{top:180px;animation-delay:10s}
@keyframes cloud{to{left:110%}}

/* WATER */
.water{
 position:absolute;inset:48% 0 0;
 background:
 radial-gradient(ellipse at 20% 20%,rgba(255,255,255,.3) 0 2px,transparent 3px),
 radial-gradient(ellipse at 70% 65%,rgba(255,255,255,.25) 0 2px,transparent 3px);
 background-size:90px 55px
}

/* HEADER */
.header{
 position:absolute;z-index:20;top:14px;left:12px;right:12px;
 display:flex;gap:7px
}
.stat{
 flex:1;text-align:center;padding:9px 5px;
 border:1px solid rgba(255,255,255,.25);
 border-radius:14px;background:rgba(7,22,38,.82);
 backdrop-filter:blur(10px);font-weight:bold;
 box-shadow:0 5px 18px #0005
}
.stat small{display:block;font-size:9px;opacity:.7;margin-bottom:3px}

/* ENERGY */
.energyBox{
 position:absolute;z-index:20;top:76px;left:15px;right:15px;
 height:19px;border:2px solid #fff8;border-radius:20px;
 background:#06101d99;overflow:hidden
}
.energy{
 height:100%;width:100%;
 background:linear-gradient(90deg,#20e66c,#d4ff39);
 box-shadow:0 0 15px #6dff75;
 transition:.3s
}

/* ISLAND */
.island{
 position:absolute;z-index:3;left:50%;top:51%;
 width:430px;height:285px;transform:translate(-50%,-50%);
 border-radius:50%;
 background:linear-gradient(#68dc72,#39ad50);
 box-shadow:inset 0 -25px 0 #17733b,0 30px 30px #001b3344
}
.sand{
 position:absolute;inset:13px;border-radius:50%;
 background:#69d85d
}
.grass{
 position:absolute;width:100%;height:100%;
 background:
 radial-gradient(circle at 25% 25%,#b0eb64 0 3px,transparent 4px),
 radial-gradient(circle at 70% 30%,#b0eb64 0 3px,transparent 4px),
 radial-gradient(circle at 40% 70%,#b0eb64 0 3px,transparent 4px)
}

/* TREES */
.tree{
 position:absolute;font-size:48px;
 filter:drop-shadow(0 7px 3px #0005);
 animation:sway 2.5s ease-in-out infinite alternate
}
.t1{left:35px;top:50px}.t2{right:42px;top:58px}
.t3{left:90px;bottom:28px}
@keyframes sway{to{transform:rotate(3deg)}}

/* ROCKS */
.rock{
 position:absolute;font-size:35px;
 filter:drop-shadow(0 6px 3px #0006)
}
.r1{left:145px;top:55px}.r2{right:125px;bottom:48px}

/* MINE */
.mine{
 position:absolute;left:50%;bottom:25px;transform:translateX(-50%);
 width:205px;height:125px;border-radius:105px 105px 30px 30px;
 background:radial-gradient(circle at 50% 55%,#02050a,#101b27 65%,#392719 66%);
 border:11px solid #694b2e;
 box-shadow:inset 0 0 35px #000,0 8px 8px #0005
}
.mine:after{
 content:"";position:absolute;left:22px;right:22px;bottom:-16px;
 height:18px;background:#533b27;border-radius:50%
}

/* ORES */
.ore{
 position:absolute;font-size:28px;
 animation:ore 1.4s infinite alternate;
 filter:drop-shadow(0 0 8px #70eaff)
}
.o1{left:35px;top:30px}.o2{right:35px;top:48px}
.o3{left:82px;bottom:20px}
@keyframes ore{to{transform:scale(1.15);filter:brightness(1.7) drop-shadow(0 0 12px #fff)}}

/* PLAYER */
.player{
 position:absolute;z-index:10;left:50%;top:44%;
 transform:translate(-50%,-50%);
 font-size:76px;
 filter:drop-shadow(0 10px 5px #0007);
 transition:.2s
}
.mining{animation:hit .25s infinite alternate}
@keyframes hit{
 to{transform:translate(-50%,-50%) rotate(-12deg) scale(1.08)}
}

/* PICKAXE */
.pickaxe{
 position:absolute;z-index:11;left:calc(50% + 25px);top:44%;
 font-size:42px;display:none
}
.mining+.pickaxe{display:block;animation:swing .25s infinite alternate}
@keyframes swing{to{transform:rotate(35deg)}}

/* FLOAT */
.float{
 position:absolute;z-index:100;left:50%;top:38%;
 transform:translateX(-50%);font-size:22px;font-weight:bold;
 text-shadow:0 2px 5px #000;pointer-events:none;
 animation:up 1s forwards
}
@keyframes up{
 to{transform:translate(-50%,-80px);opacity:0}
}

/* BOTTOM */
.nav{
 position:absolute;z-index:30;bottom:13px;left:10px;right:10px;
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px
}
button{
 border:1px solid #ffffff30;color:#fff;font-weight:bold;
 padding:12px 3px;border-radius:16px;
 background:linear-gradient(#35577b,#152b45);
 box-shadow:0 5px 0 #071321,0 8px 18px #0005;
 font-size:12px
}
button:active{transform:translateY(4px);box-shadow:0 1px #071321}
.mineBtn{background:linear-gradient(#31df72,#128d48)}

/* PANEL */
.panel{
 display:none;position:absolute;z-index:80;
 top:105px;left:14px;right:14px;bottom:100px;
 padding:20px;border:2px solid #ffffff25;border-radius:25px;
 background:rgba(7,19,34,.97);box-shadow:0 20px 60px #000b;
 backdrop-filter:blur(15px)
}
.panel h2{text-align:center;margin-bottom:18px}
.item{
 display:flex;justify-content:space-between;
 padding:14px;margin:8px 0;background:#142d48;
 border-radius:14px
}
.close{
 width:100%;margin-top:15px;background:#8d2942
}
.upgrade{
 width:100%;background:linear-gradient(#f5c34c,#b87816);
 margin-top:10px
}

/* LEVEL */
.level{
 position:absolute;z-index:20;top:102px;left:50%;
 transform:translateX(-50%);
 background:#081a2dca;border:1px solid #fff3;
 border-radius:20px;padding:6px 13px;font-size:11px;font-weight:bold
}
</style>
</head>

<body>

<div id="game">

<div class="sun"></div>
<div class="cloud"></div>
<div class="cloud c2"></div>
<div class="water"></div>

<div class="header">
 <div class="stat"><small>STONE</small>🪨 <span id="stone">0</span></div>
 <div class="stat"><small>COAL</small>⬛ <span id="coal">0</span></div>
 <div class="stat"><small>GEMS</small>💎 <span id="gems">0</span></div>
 <div class="stat"><small>COINS</small>🪙 <span id="coins">0</span></div>
</div>

<div class="energyBox">
 <div class="energy" id="energy"></div>
</div>

<div class="level">⛏️ PICKAXE LEVEL <span id="lvl">1</span></div>

<div class="island">
 <div class="sand"></div>
 <div class="grass"></div>

 <div class="tree t1">🌴</div>
 <div class="tree t2">🌳</div>
 <div class="tree t3">🌴</div>

 <div class="rock r1">🪨</div>
 <div class="rock r2">🪨</div>

 <div class="mine">
  <div class="ore o1">💎</div>
  <div class="ore o2">🟡</div>
  <div class="ore o3">🔷</div>
 </div>
</div>

<div class="player" id="player">🧑‍🔧</div>
<div class="pickaxe" id="pickaxe">⛏️</div>

<!-- INVENTORY -->
<div class="panel" id="inventory">
 <h2>🎒 INVENTORY</h2>
 <div class="item"><span>🪨 Stone</span><b id="iStone">0</b></div>
 <div class="item"><span>⬛ Coal</span><b id="iCoal">0</b></div>
 <div class="item"><span>💎 Gems</span><b id="iGems">0</b></div>
 <div class="item"><span>🪙 Coins</span><b id="iCoins">0</b></div>
 <div class="item"><span>⚡ Energy</span><b id="iEnergy">20/20</b></div>
 <button class="close" onclick="closePanels()">CLOSE</button>
</div>

<!-- UPGRADE -->
<div class="panel" id="upgrade">
 <h2>🛠️ PICKAXE FORGE</h2>
 <div class="item"><span>Current Level</span><b id="uLevel">1</b></div>
 <div class="item"><span>Upgrade Cost</span><b id="uCost">25 🪨</b></div>
 <button class="upgrade" onclick="upgradePickaxe()">UPGRADE ⛏️</button>
 <button class="close" onclick="closePanels()">CLOSE</button>
</div>

<div class="nav">
 <button class="mineBtn" onclick="mine()">⛏️<br>MINE</button>
 <button onclick="openInventory()">🎒<br>BAG</button>
 <button onclick="openUpgrade()">🛠️<br>FORGE</button>
 <button onclick="island()">🏝️<br>ISLAND</button>
</div>

</div>

<script>
let stone=0,coal=0,gems=0,coins=0;
let energy=20,maxEnergy=20,pickaxe=1;

function save(){
 localStorage.setItem("IMI",JSON.stringify({
  stone,coal,gems,coins,energy,pickaxe
 }));
}

function load(){
 let d=localStorage.getItem("IMI");
 if(d){
  d=JSON.parse(d);
  stone=d.stone||0;
  coal=d.coal||0;
  gems=d.gems||0;
  coins=d.coins||0;
  energy=d.energy??20;
  pickaxe=d.pickaxe||1;
 }
 update();
}

function update(){
 document.getElementById("stone").textContent=stone;
 document.getElementById("coal").textContent=coal;
 document.getElementById("gems").textContent=gems;
 document.getElementById("coins").textContent=coins;
 document.getElementById("lvl").textContent=pickaxe;

 document.getElementById("energy").style.width=
  Math.max(0,energy/maxEnergy*100)+"%";

 document.getElementById("iStone").textContent=stone;
 document.getElementById("iCoal").textContent=coal;
 document.getElementById("iGems").textContent=gems;
 document.getElementById("iCoins").textContent=coins;
 document.getElementById("iEnergy").textContent=energy+"/"+maxEnergy;

 document.getElementById("uLevel").textContent=pickaxe;
 document.getElementById("uCost").textContent=(pickaxe*25)+" 🪨";
 save();
}

function mine(){
 if(energy<2){
  float("⚡ NO ENERGY");
  return;
 }

 energy-=2;

 let amount=Math.floor(Math.random()*3)+2+pickaxe-1;
 stone+=amount;

 let player=document.getElementById("player");
 player.classList.add("mining");

 setTimeout(()=>player.classList.remove("mining"),600);

 if(Math.random()<.18){
  coal++;
  float("⬛ +1 COAL");
 }

 if(Math.random()<.035){
  gems++;
  coins+=10;
  float("💎 RARE GEM +10 🪙");
 }else{
  float("🪨 +"+amount+" STONE");
 }

 update();
}

function upgradePickaxe(){
 let cost=pickaxe*25;

 if(stone<cost){
  float("❌ NEED "+cost+" STONE");
  return;
 }

 stone-=cost;
 pickaxe++;

 float("🎉 PICKAXE LEVEL "+pickaxe);
 update();
}

function float(text){
 let e=document.createElement("div");
 e.className="float";
 e.textContent=text;
 document.getElementById("game").appendChild(e);
 setTimeout(()=>e.remove(),1000);
}

function openInventory(){
 closePanels();
 document.getElementById("inventory").style.display="block";
}

function openUpgrade(){
 closePanels();
 document.getElementById("upgrade").style.display="block";
}

function closePanels(){
 document.getElementById("inventory").style.display="none";
 document.getElementById("upgrade").style.display="none";
}

function island(){
 float("🏝️ INFINITE MINE ISLAND");
}

setInterval(()=>{
 if(energy<maxEnergy){
  energy++;
  update();
 }
},5000);

load();
</script>

</body>
</html>
