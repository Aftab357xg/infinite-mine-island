<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Infinite Mine Island</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#58c9e8;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:520px;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 22%),
    #54c9e7;
}

/* WATER */
.water{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.wave{
  position:absolute;
  width:180%;
  height:70px;
  left:-40%;
  border-top:4px solid rgba(255,255,255,.28);
  border-radius:50%;
  animation:wave 6s linear infinite;
}

.wave:nth-child(1){top:18%;animation-delay:0s}
.wave:nth-child(2){top:48%;animation-delay:2s}
.wave:nth-child(3){top:78%;animation-delay:4s}

@keyframes wave{
  from{transform:translateX(-8%)}
  to{transform:translateX(8%)}
}

/* TOP HUD */
.hud{
  position:absolute;
  top:12px;
  left:10px;
  right:10px;
  z-index:20;
  display:flex;
  gap:6px;
}

.stat{
  flex:1;
  min-width:0;
  padding:8px 5px;
  border-radius:13px;
  background:rgba(255,255,255,.94);
  box-shadow:0 3px 10px rgba(0,0,0,.16);
  text-align:center;
  font-weight:bold;
  color:#273b32;
}

.stat .icon{
  display:block;
  font-size:20px;
}

.stat small{
  font-size:10px;
  color:#68766f;
}

/* ISLAND */
.island{
  position:absolute;
  width:86%;
  height:58%;
  left:7%;
  top:20%;
  background:
    radial-gradient(circle at 25% 25%,#8ed85e 0 8%,transparent 9%),
    radial-gradient(circle at 70% 65%,#74c64d 0 10%,transparent 11%),
    #72c94e;
  border:10px solid #e5c27c;
  border-radius:28% 22% 25% 20%;
  box-shadow:
    0 13px 0 rgba(45,130,92,.28),
    0 20px 35px rgba(0,0,0,.18);
  z-index:5;
}

/* island inner grass */
.island:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:23% 18% 21% 17%;
  border:2px dashed rgba(40,120,55,.18);
}

/* LAND PARTS */
.part{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:15px;
  border:3px solid #4d9d3b;
  background:#a8df70;
  box-shadow:0 4px 0 #4d9d3b,0 5px 8px rgba(0,0,0,.16);
  color:#315d2c;
  font-size:17px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:4;
}

.part:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #4d9d3b;
}

/* 14 PART POSITIONS */
.p1{left:8%;top:10%}
.p2{left:31%;top:7%}
.p3{right:8%;top:10%}
.p4{left:6%;top:31%}
.p5{left:29%;top:28%}
.p6{right:7%;top:31%}
.p7{left:8%;top:54%}
.p8{left:30%;top:51%}
.p9{right:8%;top:54%}
.p10{left:7%;bottom:8%}
.p11{left:30%;bottom:6%}
.p12{right:30%;bottom:6%}
.p13{right:7%;bottom:8%}
.p14{left:45%;top:38%;}

/* TREES */
.tree{
  position:absolute;
  font-size:34px;
  z-index:3;
  filter:drop-shadow(0 4px 1px rgba(0,0,0,.18));
}

.t1{left:17%;top:20%}
.t2{right:17%;top:22%}
.t3{left:18%;bottom:17%}
.t4{right:18%;bottom:18%}

/* HOME */
.home{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:92px;
  height:78px;
  border-radius:20px;
  background:#f8e7bd;
  border:5px solid #a97842;
  box-shadow:0 7px 0 #80572f;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
}

.home-label{
  position:absolute;
  bottom:-28px;
  background:#fff;
  color:#4d3824;
  font-size:11px;
  padding:4px 10px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap;
}

/* PLAYER */
.player{
  position:absolute;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
  z-index:12;
  font-size:42px;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));
  animation:breathe 2s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{transform:translate(-50%,-50%)}
  50%{transform:translate(-50%,-54%)}
}

/* SHOPS */
.shop{
  position:absolute;
  top:34%;
  z-index:15;
  width:70px;
  padding:8px 4px;
  border-radius:16px;
  background:#fff;
  border:3px solid #d8b36a;
  box-shadow:0 5px 12px rgba(0,0,0,.22);
  text-align:center;
  font-weight:bold;
  color:#49371e;
  font-size:11px;
}

.shop span{
  display:block;
  font-size:31px;
  margin-bottom:3px;
}

.tool-shop{left:5px}
.item-shop{right:5px}

/* TITLE */
.title{
  position:absolute;
  top:77px;
  left:50%;
  transform:translateX(-50%);
  z-index:18;
  background:rgba(255,255,255,.94);
  padding:6px 15px;
  border-radius:18px;
  font-size:14px;
  font-weight:900;
  color:#34553a;
  box-shadow:0 3px 8px rgba(0,0,0,.12);
  white-space:nowrap;
}

/* BOTTOM */
.bottom{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  z-index:30;
  display:flex;
  gap:7px;
}

.nav{
  flex:1;
  border:0;
  border-radius:16px;
  padding:9px 3px;
  background:rgba(255,255,255,.96);
  color:#38543e;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.nav span{
  display:block;
  font-size:21px;
}

.nav small{
  font-size:9px;
}

/* POPUP */
.popup{
  position:absolute;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.popup-box{
  width:100%;
  max-width:360px;
  background:white;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.popup-box h2{
  margin:5px 0 10px;
}

.close{
  margin-top:15px;
  border:0;
  padding:10px 25px;
  border-radius:12px;
  background:#4caf50;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

  <div class="water">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="hud">
    <div class="stat"><span class="icon">🪵</span><small>WOOD</small><br><span id="wood">0</span></div>
    <div class="stat"><span class="icon">🪨</span><small>STONE</small><br><span id="stone">0</span></div>
    <div class="stat"><span class="icon">⚙️</span><small>IRON</small><br><span id="iron">0</span></div>
    <div class="stat"><span class="icon">🟡</span><small>GOLD</small><br><span id="gold">0</span></div>
    <div class="stat"><span class="icon">💎</span><small>GEMS</small><br><span id="gems">0</span></div>
  </div>

  <div class="title">🏝️ INFINITE MINE ISLAND</div>

  <div class="island">

    <button class="part p1" onclick="part(1)">1</button>
    <button class="part p2" onclick="part(2)">2</button>
    <button class="part p3" onclick="part(3)">3</button>
    <button class="part p4" onclick="part(4)">4</button>
    <button class="part p5" onclick="part(5)">5</button>
    <button class="part p6" onclick="part(6)">6</button>
    <button class="part p7" onclick="part(7)">7</button>
    <button class="part p8" onclick="part(8)">8</button>
    <button class="part p9" onclick="part(9)">9</button>
    <button class="part p10" onclick="part(10)">10</button>
    <button class="part p11" onclick="part(11)">11</button>
    <button class="part p12" onclick="part(12)">12</button>
    <button class="part p13" onclick="part(13)">13</button>
    <button class="part p14" onclick="part(14)">14</button>

    <div class="tree t1">🌳</div>
    <div class="tree t2">🌳</div>
    <div class="tree t3">🌲</div>
    <div class="tree t4">🌲</div>

    <div class="home">
      🏠
      <div class="home-label">HOME</div>
    </div>

    <div class="player">🧑‍🌾</div>
  </div>

  <button class="shop tool-shop" onclick="openShop('Tool Shop')">
    <span>⛏️</span>
    TOOL<br>SHOP
  </button>

  <button class="shop item-shop" onclick="openShop('Item Shop')">
    <span>🏪</span>
    ITEM<br>SHOP
  </button>

  <div class="bottom">
    <button class="nav" onclick="openShop('Tool Shop')">
      <span>⛏️</span><small>TOOLS</small>
    </button>

    <button class="nav" onclick="openInventory()">
      <span>🎒</span><small>BAG</small>
    </button>

    <button class="nav" onclick="openShop('Build')">
      <span>🛠️</span><small>BUILD</small>
    </button>

    <button class="nav" onclick="openIslands()">
      <span>🏝️</span><small>ISLANDS</small>
    </button>
  </div>

  <div class="popup" id="popup">
    <div class="popup-box">
      <h2 id="popupTitle">Infinite Mine Island</h2>
      <p id="popupText">Coming soon...</p>
      <button class="close" onclick="closePopup()">CLOSE</button>
    </div>
  </div>

</div>

<script>
let resources = {
  wood:0,
  stone:0,
  iron:0,
  gold:0,
  gems:0
};

function part(number){
  document.getElementById("popupTitle").textContent = "Island Part " + number;
  document.getElementById("popupText").textContent =
    "This area is ready for mining and buildings. We will add the resource system next.";
  document.getElementById("popup").style.display="flex";
}

function openShop(name){
  document.getElementById("popupTitle").textContent = name;
  document.getElementById("popupText").textContent =
    "Shop system coming next. Tools and items will be added here.";
  document.getElementById("popup").style.display="flex";
}

function openInventory(){
  document.getElementById("popupTitle").textContent = "🎒 Inventory";
  document.getElementById("popupText").innerHTML =
    "🪵 Wood: "+resources.wood+
    "<br>🪨 Stone: "+resources.stone+
    "<br>⚙️ Iron: "+resources.iron+
    "<br>🟡 Gold: "+resources.gold+
    "<br>💎 Gems: "+resources.gems;
  document.getElementById("popup").style.display="flex";
}

function openIslands(){
  document.getElementById("popupTitle").textContent = "🏝️ Islands";
  document.getElementById("popupText").textContent =
    "Island 2 is your starting island. More islands will be added later.";
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
  </html>
